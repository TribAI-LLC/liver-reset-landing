name: Deploy to Vercel on master push

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pnpm from package.json
        shell: bash
        run: |
          set -e
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")
          npm install --global "pnpm@${PNPM_VERSION}"
          NPM_GLOBAL_BIN=$(npm bin --global)
          echo "$NPM_GLOBAL_BIN" >> "$GITHUB_PATH"

      - name: Verify pnpm is available
        shell: bash
        run: |
          set -e
          command -v pnpm
          pnpm --version

      - name: Validate required Vercel secrets
        shell: bash
        run: |
          set -e
          test -n "${{ secrets.VERCEL_TOKEN }}" || { echo "Missing secret: VERCEL_TOKEN"; exit 1; }
          test -n "${{ secrets.VERCEL_ORG_ID }}" || { echo "Missing secret: VERCEL_ORG_ID"; exit 1; }
          test -n "${{ secrets.VERCEL_PROJECT_ID }}" || { echo "Missing secret: VERCEL_PROJECT_ID"; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
